syntax = "proto3";

package config.assistant;

import "google/protobuf/empty.proto";

service AssistantController {
    rpc Clear(google.protobuf.Empty) returns (google.protobuf.Empty) {}
    rpc History(HistoryQuery) returns (ChatReply) {}
    rpc LinkCard(CardLink) returns (google.protobuf.Empty) {}
    rpc ParseSms(SmsText) returns (SmsCard) {}
    rpc Send(MessageSend) returns (ChatReply) {}
}

message Card {
    string kind = 1;
    int64 amount_minor = 2;
    string currency = 3;
    string wallet_id = 4;
    string to_wallet_id = 5;
    string category_id = 6;
    string note = 7;
    string occurred_at = 8;
}

message CardLink {
    string last4 = 1;
    string wallet_id = 2;
}

message ChatReply {
    repeated Message messages = 1;
}

message HistoryQuery {
    int32 limit = 1;
}

message Message {
    string id = 1;
    string role = 2;
    string text = 3;
    string created_at = 4;
    Card card = 6;
    bool card_present = 7;
}

message MessageSend {
    string text = 1;
    string client_mutation_id = 2;
}

message SmsCard {
    string ignored = 1;
    string kind = 2;
    int64 amount_minor = 3;
    string currency = 4;
    string wallet_id = 5;
    string confidence = 6;
    string occurred_at = 7;
    bool balance_present = 8;
    int64 balance_minor = 9;
    string last4 = 10;
    string category_id = 11;
    repeated string suggested_category_ids = 12;
    string duplicate_entry_id = 13;
}

message SmsText {
    string text = 1;
}

