syntax = "proto3";

package config.wallets;

import "google/protobuf/empty.proto";

service CategoryController {
    rpc BudgetStatus(BudgetWindow) returns (BudgetStatusReply) {}
    rpc Create(CategoryCreate) returns (CategoryReply) {}
    rpc Delete(CategoryRef) returns (google.protobuf.Empty) {}
    rpc List(google.protobuf.Empty) returns (CategoryListReply) {}
    rpc SetBudget(BudgetSet) returns (google.protobuf.Empty) {}
}

service LedgerController {
    rpc Delete(EntryRef) returns (google.protobuf.Empty) {}
    rpc Edit(EntryEdit) returns (EntryReply) {}
    rpc List(EntryQuery) returns (EntryListReply) {}
    rpc Record(EntryRecord) returns (EntryReply) {}
    rpc RecordSplit(SplitRequest) returns (EntryListReply) {}
    rpc Refund(RefundRequest) returns (EntryReply) {}
    rpc Transfer(TransferRequest) returns (EntryListReply) {}
}

service WalletsController {
    rpc Archive(WalletRef) returns (WalletReply) {}
    rpc Create(WalletCreate) returns (WalletReply) {}
    rpc List(google.protobuf.Empty) returns (WalletListReply) {}
}

message BudgetRow {
    string category_id = 1;
    string category_name = 2;
    string currency = 3;
    int64 limit_minor = 4;
    int64 spent_minor = 5;
}

message BudgetSet {
    string category_id = 1;
    string currency = 2;
    int64 limit_minor = 3;
}

message BudgetStatusReply {
    repeated BudgetRow budgets = 1;
}

message BudgetWindow {
    string starts_at = 1;
    string ends_at = 2;
}

message Category {
    string id = 1;
    string name = 2;
    string kind = 3;
    bool is_other = 4;
}

message CategoryCreate {
    string name = 1;
    string kind = 2;
}

message CategoryListReply {
    repeated Category categories = 1;
}

message CategoryRef {
    string category_id = 1;
}

message CategoryReply {
    Category category = 1;
}

message CurrencyTotal {
    string currency = 1;
    int64 balance_minor = 2;
}

message Entry {
    string id = 1;
    string wallet_id = 2;
    string kind = 3;
    int64 amount_minor = 4;
    string currency = 5;
    string occurred_at = 6;
    string note = 7;
    string category_id = 8;
    bool outside_totals = 9;
    string split_id = 10;
    string refund_of = 11;
    int64 refunded_minor = 12;
}

message EntryEdit {
    string entry_id = 1;
    int64 amount_minor = 2;
    string occurred_at = 3;
    string note = 4;
    string category_id = 5;
    optional bool outside_totals = 6;
}

message EntryListReply {
    repeated Entry entries = 1;
}

message EntryQuery {
    string wallet_id = 1;
    int32 limit = 2;
}

message EntryRecord {
    string wallet_id = 1;
    string kind = 2;
    int64 amount_minor = 3;
    string occurred_at = 4;
    string note = 5;
    string client_mutation_id = 6;
    string category_id = 7;
    bool outside_totals = 8;
}

message EntryRef {
    string entry_id = 1;
}

message EntryReply {
    Entry entry = 1;
}

message RefundRequest {
    string entry_id = 1;
    string wallet_id = 2;
    int64 amount_minor = 3;
    string occurred_at = 4;
    string note = 5;
    string client_mutation_id = 6;
}

message SplitPartMsg {
    string category_id = 1;
    int64 amount_minor = 2;
    bool outside_totals = 3;
}

message SplitRequest {
    string wallet_id = 1;
    repeated SplitPartMsg parts = 2;
    string occurred_at = 3;
    string note = 4;
    string client_mutation_id = 5;
}

message TransferRequest {
    string from_wallet_id = 1;
    string to_wallet_id = 2;
    int64 amount_minor = 3;
    string rate = 4;
    int64 fee_minor = 5;
    string occurred_at = 6;
    string note = 7;
    string client_mutation_id = 8;
}

message Wallet {
    string id = 1;
    string name = 2;
    string kind = 3;
    string currency = 4;
    string bank = 5;
    bool archived = 6;
    int64 balance_minor = 7;
}

message WalletCreate {
    string name = 1;
    string kind = 2;
    string currency = 3;
    string bank = 4;
    int64 opening_balance_minor = 5;
    string client_mutation_id = 6;
}

message WalletListReply {
    repeated Wallet wallets = 1;
    repeated CurrencyTotal totals = 2;
}

message WalletRef {
    string wallet_id = 1;
}

message WalletReply {
    Wallet wallet = 1;
}

