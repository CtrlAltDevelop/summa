name: Bug report
description: Something is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [App, Backend, Landing site, Docs, Not sure]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: For example macOS 15, iPhone 17 simulator, Android 15.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any phone numbers, tokens or real financial data first.
