# Local dev services. Django and Flutter run on the host for fast reload.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: summa
      POSTGRES_USER: summa
      POSTGRES_PASSWORD: summa-dev-only
    ports: ["127.0.0.1:5432:5432"]  # loopback only: the dev password is in the repo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summa"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]  # loopback only: no password
volumes:
  pgdata:
